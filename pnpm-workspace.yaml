  postcss: ^8.5.15
  postcss@<=8.5.17: '>=8.5.18'
  preact: ^10.27.3
  qs: ^6.14.2
  rollup: ^4.59.0
  sharp@<0.35.0: '>=0.35.0'
  underscore: ^1.13.8
  uuid: ^11.1.1
  valibot@<=1.4.1: '>=1.4.2'
  vite: ^6.4.2
  ws: ^8.20.1
